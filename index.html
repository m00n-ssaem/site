   </header><!-- Main -->
   <main class="flex-1 w-full max-w-5xl mx-auto px-4 py-8">
    <!-- Subject Filter -->
    <div class="mb-8 flex flex-wrap gap-3 justify-center items-center">
     <label for="subject-filter" class="text-white font-semibold">과목 선택:</label> <select id="subject-filter" class="px-4 py-2 rounded-lg border border-teal-300 bg-white text-teal-700 font-semibold focus:outline-none focus:ring-2 focus:ring-teal-400 cursor-pointer"> <option value="">전체 보기</option> <option value="국어">국어</option> <option value="수학">수학</option> <option value="영어">영어</option> <option value="사회">사회</option> <option value="과학">과학</option> <option value="체육">체육</option> <option value="음악">음악</option> <option value="미술">미술</option> <option value="도덕">도덕</option> <option value="창체">창체</option> <option value="실과">실과</option> <option value="기타">기타</option> </select>

    <div class="text-center"><button onclick="openModal()" class="inline-flex items-center gap-2 px-6 py-3 rounded-full text-white font-semibold text-lg shadow-lg hover:scale-105 transition-transform" style="background: linear-gradient(90deg, #319795, #2c7a7b);"> <i data-lucide="plus-circle" style="width:22px;height:22px;"></i> 새로운 사이트 추가하기 </button>

  </div><!-- Modal -->

     <div><label for="subject-input" class="block text-sm font-medium text-teal-700 mb-1">과목</label> <select id="subject-input" class="w-full px-4 py-2 rounded-lg border border-teal-200 focus:outline-none focus:ring-2 focus:ring-teal-400"> <option value="">선택하세요</option> <option value="국어">국어</option> <option value="수학">수학</option> <option value="영어">영어</option> <option value="사회">사회</option> <option value="과학">과학</option> <option value="체육">체육</option> <option value="음악">음악</option> <option value="미술">미술</option> <option value="도덕">도덕</option> <option value="창체">창체</option> <option value="실과">실과</option> <option value="기타">기타</option> </select>
     </div>
     <div><label for="name-input" class="block text-sm font-medium text-teal-700 mb-1">사이트명</label> <input id="name-input" type="text" placeholder="예: 네이버 클래스" class="w-full px-4 py-2 rounded-lg border border-teal-200 focus:outline-none focus:ring-2 focus:ring-teal-400">
     </div>
     <div><label for="url-input" class="block text-sm font-medium text-teal-700 mb-1">URL</label> <input id="url-input" type="text" placeholder="예: https://naver.com" class="w-full px-4 py-2 rounded-lg border border-teal-200 focus:outline-none focus:ring-2 focus:ring-teal-400">
     </div>
     <div id="form-error" class="text-red-500 text-sm hidden"></div>
     <div class="flex gap-3 pt-2"><button type="button" onclick="closeModal()" class="flex-1 py-2 rounded-lg border border-teal-300 text-teal-700 font-medium hover:bg-teal-50 transition">취소</button> <button type="submit" id="submit-btn" class="flex-1 py-2 rounded-lg text-white font-medium hover:opacity-90 transition" style="background:#319795;">추가하기</button>
     </div>
    </form>
   </div>
  </div><!-- Delete confirm -->
  <div id="delete-confirm" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-50 p-4">
   <div class="glass-card rounded-2xl p-6 w-full max-w-sm text-center" style="background: rgba(255,255,255,0.9);">
    <p class="text-lg font-semibold text-gray-800 mb-4">이 사이트를 삭제할까요?</p>
    <div class="flex gap-3"><button onclick="cancelDelete()" class="flex-1 py-2 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-50">취소</button> <button onclick="confirmDelete()" id="confirm-delete-btn" class="flex-1 py-2 rounded-lg bg-red-500 text-white font-medium hover:bg-red-600">삭제</button>
    </div>
   </div>
  </div>
  <script>
    let sites = [];
    let deleteTarget = null;
    let currentFilter = '';
    let editTarget = null;

    const defaultConfig = {
      app_title: 'm00n 웹앱 모음',
      welcome_message: '오늘도 화이팅! 💪',
      footer_text: '행복한 학교생활을 응원합니다! 💚',
      primary_color: '#319795',
      background_color: '#b2f5ea',
      text_color: '#234e52',
      card_bg_color: 'rgba(255,255,255,0.25)',
      font_family: 'Fredoka',
      font_size: 16
    };

    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (config) => {
        document.getElementById('app-title').textContent = config.app_title || defaultConfig.app_title;
        document.getElementById('welcome-msg').textContent = config.welcome_message || defaultConfig.welcome_message;
        document.getElementById('footer-text').textContent = config.footer_text || defaultConfig.footer_text;
        const font = config.font_family || defaultConfig.font_family;
        document.body.style.fontFamily = `${font}, Fredoka, sans-serif`;
        const size = config.font_size || defaultConfig.font_size;
        document.body.style.fontSize = `${size}px`;
        document.getElementById('app-title').style.fontSize = `${size * 1.8}px`;
        // 카드 배경색 업데이트 (모달 제외)
        const cardBgColor = config.card_bg_color || defaultConfig.card_bg_color;
        document.querySelectorAll('.glass-card:not(#modal .glass-card)').forEach(card => {
          card.style.background = cardBgColor;
        });
      },
      mapToCapabilities: (config) => ({
        recolorables: [
          { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
          { get: () => config.primary_color || defaultConfig.primary_color, set: (v) => { config.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); } },
          { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } }
        ],
        borderables: [],
        fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
        fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
      }),
      mapToEditPanelValues: (config) => new Map([
        ['app_title', config.app_title || defaultConfig.app_title],
        ['welcome_message', config.welcome_message || defaultConfig.welcome_message],
        ['card_bg_color', config.card_bg_color || defaultConfig.card_bg_color],
        ['footer_text', config.footer_text || defaultConfig.footer_text]
      ])
    });

    // Data SDK
    const dataHandler = {
      onDataChanged(data) {
        sites = data;
        document.getElementById('loading').classList.add('hidden');
        renderCards();
      }
    };

    (async () => {
      const res = await window.dataSdk.init(dataHandler);
      if (!res.isOk) document.getElementById('loading').textContent = '데이터를 불러올 수 없습니다.';
    })();

    document.getElementById('subject-filter').addEventListener('change', (e) => {
      currentFilter = e.target.value;
      renderCards();
    });

    function renderCards() {
      const grid = document.getElementById('card-grid');
      const filteredSites = currentFilter ? sites.filter(s => s.subject === currentFilter) : sites;
      const existingMap = new Map([...grid.children].map(el => [el.dataset.id, el]));
      const currentIds = new Set(filteredSites.map(s => s.__backendId));

      existingMap.forEach((el, id) => { if (!currentIds.has(id)) el.remove(); });

      filteredSites.forEach(site => {
        const existing = existingMap.get(site.__backendId);
        if (existing) {
          existing.querySelector('.site-subject').textContent = site.subject;
          existing.querySelector('.site-name').textContent = site.site_name;
        } else {
          const card = document.createElement('div');
          card.dataset.id = site.__backendId;
          card.className = 'glass-card card-hover rounded-2xl p-5 relative transition-all duration-300 cursor-pointer';
          card.innerHTML = `
            <div class="action-btns absolute top-2 right-2 flex gap-2 opacity-0 transition-opacity duration-200">
              <button class="edit-btn w-7 h-7 bg-blue-500 hover:bg-blue-600 text-white rounded-full flex items-center justify-center text-sm font-bold shadow" onclick="handleEditClick(event, '${site.__backendId}')">✎</button>
              <button class="delete-btn w-7 h-7 bg-red-500 hover:bg-red-600 text-white rounded-full flex items-center justify-center text-sm font-bold shadow" onclick="startDelete(event, '${site.__backendId}')">×</button>
            </div>
            <div class="site-subject text-sm font-semibold text-teal-600 mb-2 uppercase">${site.subject}</div>
            <h3 class="site-name text-lg font-bold text-teal-800 mb-3">${site.site_name}</h3>
          `;
          card.addEventListener('click', () => handleCardClick(site));
          grid.appendChild(card);
          lucide.createIcons();
        }
      });

      if (filteredSites.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-12 text-white text-lg">등록된 사이트가 없습니다.</div>';
      }
    }

    function handleEditClick(event, id) {
      event.stopPropagation();
      const site = sites.find(s => s.__backendId === id);
      editTarget = site;
      document.getElementById('subject-input').value = site.subject;
      document.getElementById('name-input').value = site.site_name;
      document.getElementById('url-input').value = site.url;
      document.getElementById('add-form').dataset.mode = 'edit';
      document.querySelector('#modal h2').textContent = '사이트 수정';
      document.getElementById('submit-btn').textContent = '수정하기';
      openModal();
    }

    function openModal() { document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex'); }
    function closeModal() { document.getElementById('modal').classList.add('hidden'); document.getElementById('modal').classList.remove('flex'); document.getElementById('add-form').reset(); document.getElementById('form-error').classList.add('hidden'); document.getElementById('add-form').dataset.mode = 'add'; document.querySelector('#modal h2').textContent = '새로운 사이트 추가'; document.getElementById('submit-btn').textContent = '추가하기'; editTarget = null; }

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const subject = document.getElementById('subject-input').value.trim();
      const site_name = document.getElementById('name-input').value.trim();
      const url = document.getElementById('url-input').value.trim();
      const mode = document.getElementById('add-form').dataset.mode || 'add';
      
      if (!subject) { document.getElementById('form-error').textContent = '과목을 선택해주세요.'; document.getElementById('form-error').classList.remove('hidden'); return; }
      if (!site_name) { document.getElementById('form-error').textContent = '사이트명을 입력해주세요.'; document.getElementById('form-error').classList.remove('hidden'); return; }
      if (!url) { document.getElementById('form-error').textContent = 'URL을 입력해주세요.'; document.getElementById('form-error').classList.remove('hidden'); return; }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      
      if (mode === 'edit') {
        editTarget.subject = subject;
        editTarget.site_name = site_name;
        editTarget.url = url;
        const res = await window.dataSdk.update(editTarget);
        btn.disabled = false;
        if (res.isOk) closeModal();
        else { document.getElementById('form-error').textContent = '저장에 실패했습니다. 다시 시도해주세요.'; document.getElementById('form-error').classList.remove('hidden'); }
      } else {
        if (sites.length >= 999) { document.getElementById('form-error').textContent = '최대 999개까지 추가할 수 있습니다.'; document.getElementById('form-error').classList.remove('hidden'); btn.disabled = false; return; }
        const res = await window.dataSdk.create({ subject, site_name, url, created_at: new Date().toISOString() });
        btn.disabled = false;
        if (res.isOk) closeModal();
        else { document.getElementById('form-error').textContent = '저장에 실패했습니다. 다시 시도해주세요.'; document.getElementById('form-error').classList.remove('hidden'); }
      }
    });

    function startDelete(event, id) { event.stopPropagation(); deleteTarget = sites.find(s => s.__backendId === id); document.getElementById('delete-confirm').classList.remove('hidden'); document.getElementById('delete-confirm').classList.add('flex'); }
    function cancelDelete() { deleteTarget = null; document.getElementById('delete-confirm').classList.add('hidden'); document.getElementById('delete-confirm').classList.remove('flex'); }
    async function confirmDelete() {
      if (!deleteTarget) return;
      const btn = document.getElementById('confirm-delete-btn');
      btn.disabled = true; btn.textContent = '삭제 중...';
      await window.dataSdk.delete(deleteTarget);
      btn.disabled = false; btn.textContent = '삭제';
      cancelDelete();
    }

    lucide.createIcons();
  </script>
 </body>
</html>
